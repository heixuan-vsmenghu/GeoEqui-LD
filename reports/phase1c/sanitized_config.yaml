schema_version: 1
phase: phase1c-supervised-specialized-enhancer-control
data_scope:
  train_samples: 300
  validation_samples: 100
  testing_frozen: true
  unlabeled_training_used: false
reproducibility:
  seed: 42
  data_order_seeded: true
  deterministic_algorithms: warn_only
  strict_bitwise_reproducibility_claimed: false
  precision: float32
  amp_enabled: false
training:
  epochs: 16
  batch_size: 1
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 5.0
  foreach: false
  loss_weights:
    heatmap_mse: 1.0
    coordinate_smooth_l1: 10.0
    distribution_js: 1.0
  selection_order:
  - penalized_aop_mae_deg
  - MRE_ALL
  - earlier_epoch
geometry:
  input_size:
  - 512
  - 512
  heatmap_size:
  - 256
  - 256
  heatmap_sigma_px: 4.0
  dsnt_temperature: 0.05
  align_corners: true
  keypoint_order:
  - PS1
  - PS2
  - FH1
model:
  class: HRNetW32SpecializedHeatmap
  backbone: hrnet_w32
  pretrained: false
  feature_channels: 32
  ps_operator: torchvision.ops.DeformConv2d
  ps_offset_channels: 18
  ps_mask_channels: 9
  ps_normalization: LayerNorm2d
  fh_aspp_dilations:
  - 1
  - 3
  - 6
  fh_se_hidden_channels: 8
  fh_normalization: LayerNorm2d
resources:
  operator_probe_max_seconds: 300
  tiny_max_steps: 500
  tiny_max_seconds: 2400
  formal_max_seconds: 9000
  total_gpu_max_seconds: 10800
