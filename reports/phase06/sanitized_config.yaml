phase: phase0.6-long-budget-fidelity
scope: supervised train/validation long-budget fidelity check
selection_split: validation
testing_frozen: true
data_sample_counts:
  train: 300
  validation: 100
seed: 42
model:
  class: HeatmapUNet
  trainable_parameters: 484171
training:
  input_size_hw:
  - 512
  - 512
  heatmap_size_hw:
  - 256
  - 256
  sigma_heatmap_px: 4.0
  align_corners: true
  dsnt_temperature: 0.05
  keypoint_order:
  - PS1
  - PS2
  - FH1
  base_channels: 8
  batch_size: 1
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  max_grad_norm: 5.0
  num_workers: 0
optimizer:
  class: Adam
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  amsgrad: false
checkpoint_selection:
- aop_mae_deg
- MRE_ALL
- earlier_epoch
milestones:
- 20
- 50
- 100
- 150
- 200
variants:
  B0:
    description: heatmap MSE
    weights:
    - 1.0
    - 0.0
    - 0.0
  B1:
    description: heatmap MSE + coordinate SmoothL1
    weights:
    - 1.0
    - 10.0
    - 0.0
  B2:
    description: heatmap MSE + coordinate SmoothL1 + distribution JS
    weights:
    - 1.0
    - 10.0
    - 1.0
