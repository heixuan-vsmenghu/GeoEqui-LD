project:
  name: GeoEqui-LD
  phase: phase1a-b0-diagnostics
  parent_commit: f7f8b6365bb014988b991a2efe2f8bd2f7660429
  scope: endpoint characterization without training or causal attribution
  testing_frozen: true

data_contract:
  allowed_splits: [train, validation]
  forbidden_splits: [test, testing]
  train:
    sample_count: 300
    fingerprint_required: true
    source_columns: {PS1: PS1, PS2: PS2, FH1: FH1}
  validation:
    sample_count: 100
    fingerprint_required: true
    source_columns: {PS1: PS1, PS2: PS2, FH1: AOP Tangency}

diagnostic:
  seed: 42
  device: cpu
  batch_size: 1
  num_workers: 0
  input_size_hw: [512, 512]
  heatmap_size_hw: [256, 256]
  sigma_heatmap_px: 4.0
  align_corners: true
  dsnt_temperature: 0.05
  keypoint_order: [PS1, PS2, FH1]
  aop_vertex_index: 0
  aop_pubic_axis_other_index: 1
  aop_fetal_head_index: 2
  foreground_radius_heatmap_px: 12
  probability_mass_radius_heatmap_px: 12
  peak_tie_atol: 1.0e-8
  peak_tie_rtol: 1.0e-6
  visualization_seed: 42
  visualization_train_count: 4
  visualization_validation_count: 4
  synthetic_temperatures: [1.0, 0.05]
  synthetic_amplitudes: [0.1, 0.01]
  synthetic_points_heatmap_xy:
    - [80.0, 160.0]
    - [160.0, 160.0]
    - [105.0, 80.0]

