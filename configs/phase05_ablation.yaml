project:
  name: GeoEqui-LD
  phase: phase0.5-supervised-ablation
  parent_phase0_commit: f304271a238c9fcb97ac9eff070b946a4cedec62
  parent_phase0_tag: phase0-v0.1.0
  testing_frozen: true

selection:
  split: validation
  common_decoder: dsnt
  checkpoint_selection: [aop_mae_deg, MRE_ALL, earlier_epoch]
  variant_retention: [aop_mae_deg, MRE_ALL, simpler_objective]
  first_round_seed: 42
  confirmation_seeds: [43, 44, 45]
  retain_after_first_round: 2

data_contract:
  allowed_splits: [train, validation]
  forbidden_splits: [test, testing]
  train:
    sample_count: 300
    fingerprint_required: true
    source_columns: {PS1: PS1, PS2: PS2, FH1: FH1}
  validation:
    sample_count: 100
    fingerprint_required: true
    source_columns: {PS1: PS1, PS2: PS2, FH1: AOP Tangency}

training:
  seed: 42
  device: auto
  deterministic: true
  input_size_hw: [512, 512]
  heatmap_size_hw: [256, 256]
  sigma_heatmap_px: 4.0
  align_corners: true
  dsnt_temperature: 0.05
  keypoint_order: [PS1, PS2, FH1]
  aop_vertex_index: 0
  aop_pubic_axis_other_index: 1
  aop_fetal_head_index: 2
  base_channels: 8
  batch_size: 1
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  heatmap_loss_weight: 1.0
  coordinate_loss_weight: 10.0
  distribution_loss_weight: 1.0
  max_grad_norm: 5.0
  num_workers: 0
  checkpoint_metric: aop_mae_deg

variants:
  B0:
    description: heatmap MSE
    weights: [1.0, 0.0, 0.0]
    validation_decoders: [dsnt, argmax]
  B1:
    description: heatmap MSE + coordinate SmoothL1
    weights: [1.0, 10.0, 0.0]
    validation_decoders: [dsnt]
  B2:
    description: heatmap MSE + coordinate SmoothL1 + distribution JS
    weights: [1.0, 10.0, 1.0]
    validation_decoders: [dsnt]
