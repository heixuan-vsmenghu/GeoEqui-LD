project:
  name: GeoEqui-LD
  phase: phase0-supervised-baseline-frozen
  source_run: baseline_20e

data:
  train:
    sample_count: 300
    source_columns: {PS1: PS1, PS2: PS2, FH1: FH1}
  validation:
    sample_count: 100
    source_columns: {PS1: PS1, PS2: PS2, FH1: AOP Tangency}

training:
  seed: 42
  device: auto
  deterministic: true
  input_size_hw: [512, 512]
  heatmap_size_hw: [256, 256]
  sigma_heatmap_px: 4.0
  align_corners: true
  dsnt_temperature: 0.05
  keypoint_order: [PS1, PS2, FH1]
  aop_vertex_index: 0
  aop_pubic_axis_other_index: 1
  aop_fetal_head_index: 2
  base_channels: 8
  batch_size: 1
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  heatmap_loss_weight: 1.0
  coordinate_loss_weight: 10.0
  distribution_loss_weight: 1.0
  max_grad_norm: 5.0
  num_workers: 0
  optimizer: Adam
  checkpoint_metric: aop_mae_deg

model:
  class: HeatmapUNet
  trainable_parameters: 484171
