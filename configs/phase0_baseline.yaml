project:
  name: GeoEqui-LD
  phase: phase0
  seed: 42

# This committed configuration contains relative placeholders only. Data is
# deliberately excluded from Git. Copy phase0_local.example.yaml to
# phase0_local.yaml and set GEOEQUI_DATA_ROOT for local execution.
data:
  root: data/external/iugc2025
  expected_counts:
    train: 300
    validation: 100
    testing: 501
    # Public materials disagree on the unlabeled count; leave it unresolved.
    unlabeled: null
  splits:
    train:
      enabled: true
      required: true
      image_dir: Training/Labeled cases
      csv: Training/Labeled cases/label.csv
      aop_csv: null
    validation:
      enabled: true
      required: true
      image_dir: Validation
      csv: Validation/landmarks_data.csv
      aop_csv: Validation/aop_results.csv
    testing:
      enabled: true
      required: true
      image_dir: Testing
      csv: Testing/landmarks_data.csv
      aop_csv: Testing/aop_results.csv
    unlabeled:
      enabled: true
      required: false
      image_dir: Training/Unlabeled cases
      csv: null
      aop_csv: null

task:
  source_keypoint_order: [PS1, PS2, FH1]
  semantic_mapping:
    status: supported_by_baseline_and_data_audit
    PS_R: PS1
    PS_L: PS2
    FH_T: FH1
  aop:
    # Confirmed only for the public PS1/PS2/FH1 source labels. This does not
    # resolve the PS_R/PS_L/FH_T aliases.
    source_definition_confirmed: true
    vertex_key: PS1
    pubic_axis_other_key: PS2
    fetal_head_key: FH1
    output_unit: degrees

geometry:
  input_size_hw: [512, 512]
  heatmap_size_hw: [256, 256]
  align_corners: true
  sigma_heatmap_px: 4.0

model:
  input_channels: 1
  num_keypoints: 3
  base_channels: 16

training:
  seed: 42
  deterministic: true
  input_size_hw: [512, 512]
  heatmap_size_hw: [256, 256]
  sigma_heatmap_px: 4.0
  align_corners: true
  dsnt_temperature: 0.05
  keypoint_order: [PS1, PS2, FH1]
  aop_vertex_index: 0
  aop_pubic_axis_other_index: 1
  aop_fetal_head_index: 2
  base_channels: 16
  batch_size: 1
  epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0001
  heatmap_loss_weight: 1.0
  coordinate_loss_weight: 10.0
  distribution_loss_weight: 1.0
  max_grad_norm: null
  num_workers: 0
  device: auto
  checkpoint_metric: aop_mae_deg

audit:
  output_dir: reports/phase0/generated
  hash_mode: both
  include_relative_paths: false

visualization:
  output_dir: artifacts/phase0/visualizations
  split: train
  samples: 20
  include_filenames: false
