schema_version: 1
experiment_name: H1_shared_B2_seed42_20e
testing_frozen: true

training:
  seed: 42
  device: auto
  deterministic: true
  input_size_hw: [512, 512]
  heatmap_size_hw: [256, 256]
  sigma_heatmap_px: 4.0
  align_corners: true
  dsnt_temperature: 0.05
  keypoint_order: [PS1, PS2, FH1]
  aop_vertex_index: 0
  aop_pubic_axis_other_index: 1
  aop_fetal_head_index: 2
  batch_size: 1
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  heatmap_loss_weight: 1.0
  coordinate_loss_weight: 10.0
  distribution_loss_weight: 1.0
  max_grad_norm: 5.0
  num_workers: 0
  checkpoint_metric: aop_mae_deg

model:
  class: HRNetW32SharedHeatmap
  backbone: hrnet_w32
  timm_version: 1.0.28
  pretrained: false
  in_channels: 1
  out_channels: 3
  feature_location: ""
  out_indices: [1]
  feature_channels: 32
  feature_reduction: 4
  decoder_channels: [32, 16]
  decoder_normalization: BatchNorm2d
  decoder_activation: GELU
  interpolation_mode: bilinear
  align_corners: true

optimizer:
  class: Adam
  betas: [0.9, 0.999]
  eps: 1.0e-08
  amsgrad: false
  foreach: false

resources:
  precision: float32
  amp_enabled: false
  allow_input_resize: false
  require_full_input_first_step_probe: true
  tiny_max_steps: 500
  tiny_max_seconds: 2400
  formal_max_seconds: 7200
  total_gpu_max_seconds: 10800
