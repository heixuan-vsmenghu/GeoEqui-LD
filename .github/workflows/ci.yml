name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install matplotlib==3.10.0 numpy==1.26.4 pandas==2.2.3 Pillow==11.1.0 PyYAML==6.0.3 huggingface-hub==0.36.2 safetensors==0.6.2 timm==1.0.28 pytest==8.4.2 ruff==0.9.10
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: CLI smoke tests
        run: |
          python scripts/train_baseline.py --help
          python scripts/overfit_tiny.py --help
          python scripts/train_phase05.py --help
          python scripts/train_phase06.py --help
          python scripts/select_phase05.py --help
          python scripts/summarize_phase05.py --help
          python scripts/summarize_phase06.py --help
          python scripts/phase1a_heatmap_sanity.py --help
          python scripts/evaluate_phase1a_mean_baseline.py --help
          python scripts/diagnose_phase1a_checkpoints.py --help
          python scripts/probe_phase1a_hrnet.py --help
          python scripts/run_phase1a_tiny_gate.py --help
          python scripts/train_phase1a_hrnet.py --help
          python scripts/summarize_phase1a.py --help
          python scripts/diagnose_phase1b_bn.py --help
          python scripts/verify_phase1b_h1_replay.py --help
          python scripts/run_phase1b_split_tiny.py --help
          python scripts/review_phase1b_split_tiny.py --help
          python scripts/train_phase1b_split.py --help
          python scripts/summarize_phase1b.py --help
          python scripts/probe_phase1c_deform.py --help
          python scripts/run_phase1c_tiny.py --help
          python scripts/review_phase1c_tiny.py --help
          python scripts/train_phase1c_specialized.py --help
          python scripts/summarize_phase1c.py --help
          python scripts/audit_phase2a_unlabeled.py --help
          python scripts/check_phase2a_h3_geometry.py --help
          python scripts/evaluate_official_t10.py --help
          python scripts/generate_baseline_one_page_pdf.py --help
