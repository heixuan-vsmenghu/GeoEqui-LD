name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install matplotlib==3.10.0 numpy==1.26.4 pandas==2.2.3 Pillow==11.1.0 PyYAML==6.0.3 pytest==8.4.2 ruff==0.9.10
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: CLI smoke tests
        run: |
          python scripts/train_baseline.py --help
          python scripts/overfit_tiny.py --help
          python scripts/train_phase05.py --help
          python scripts/select_phase05.py --help
          python scripts/summarize_phase05.py --help
